name: Canonical quote current-v1 PR certification

on:
  push:
    branches:
      - agent/canonical-quote-current-pr-20260809
    paths:
      - ".github/workflows/canonical-quote-current-pr.yml"
      - "scripts/test-canonical-quote-current-pr.sh"
  pull_request:
    paths:
      - ".github/workflows/canonical-quote-current-pr.yml"
      - "scripts/test-canonical-quote-current-pr.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-quote-current-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: PostgreSQL ${{ matrix.postgres }} exact PR head
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        postgres: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out the test repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve and freeze canonical-api-server PR 17
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              "https://api.github.com/repos/canonical-cloud/canonical-api-server.rs/pulls/17",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "declarative-migrations-test",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              value = json.load(response)
          assert value["state"] == "open"
          assert value["base"]["repo"]["full_name"] == "canonical-cloud/canonical-api-server.rs"
          assert value["base"]["ref"] == "main"
          assert value["head"]["repo"]["full_name"] == "canonical-cloud/canonical-api-server.rs"
          assert value["head"]["ref"] == "agent/quote-v1-contract-20260808"
          sha = value["head"]["sha"]
          assert len(sha) == 40 and all(c in "0123456789abcdef" for c in sha)
          print(f"sha={sha}")
          PY

      - name: Fetch only the resolved exact source commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sources/canonical-api
          git init --quiet sources/canonical-api
          git -C sources/canonical-api remote add origin \
            https://github.com/canonical-cloud/canonical-api-server.rs.git
          git -C sources/canonical-api -c protocol.version=2 fetch \
            --quiet --no-tags --depth=1 origin "${{ steps.source.outputs.sha }}"
          git -C sources/canonical-api checkout --quiet --detach FETCH_HEAD
          test "$(git -C sources/canonical-api rev-parse HEAD)" = \
            "${{ steps.source.outputs.sha }}"
          git -C sources/canonical-api remote remove origin

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            . -> target
            sources/canonical-api -> target
          key: canonical-current-pg-${{ matrix.postgres }}

      - name: Build the reviewed DPM binary
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-dpm.sh
          DPM_BIN="$(find "$GITHUB_WORKSPACE" -type f \
            -name declarative-postgres-migrate -perm -111 | head -n 1)"
          test -n "$DPM_BIN"
          "$DPM_BIN" --help >/dev/null
          echo "DPM_BIN=$DPM_BIN" >> "$GITHUB_ENV"

      - name: Verify source, fixtures, and declarative database contract
        working-directory: sources/canonical-api
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-ci-contract.py
          python3 scripts/verify-declarative-db-contract.py
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.')
          namespace=json.loads((root/'db/namespace.json').read_text())
          digest=hashlib.sha256((root/'db/schema.sql').read_bytes()).hexdigest()
          assert namespace['declarativeMigration']['sourceSha256'] == digest
          upstream=json.loads((root/'fixtures/quote-v1/UPSTREAM.lock.json').read_text())
          assert upstream['fixtureCommit'] == '9882cdeac2c1043b749ed63a78628f1d287e0dc2'
          assert upstream['schemaCommit'] == '4c6ca63ca24fa214a1cb1a917ac27f1d5265916a'
          PY

      - name: Format
        run: cargo fmt --manifest-path sources/canonical-api/Cargo.toml --all -- --check

      - name: Test all targets and features
        run: >-
          cargo test --manifest-path sources/canonical-api/Cargo.toml
          --locked --all-targets --all-features

      - name: Strict Clippy
        run: >-
          cargo clippy --manifest-path sources/canonical-api/Cargo.toml
          --locked --all-targets --all-features -- -D warnings

      - name: Build the exact API binary
        run: >-
          cargo build --manifest-path sources/canonical-api/Cargo.toml
          --locked --bin canonical-api-server

      - name: Certify current-v1 PostgreSQL behavior
        env:
          CANONICAL_API_DIR: ${{ github.workspace }}/sources/canonical-api
          POSTGRES_ADMIN_URL: postgres://postgres@127.0.0.1:5432/postgres
          POSTGRES_MAJOR: ${{ matrix.postgres }}
        run: bash scripts/test-canonical-quote-current-pr.sh

      - name: Publish bounded failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-quote-current-pg${{ matrix.postgres }}
          path: artifacts/canonical-quote-current/pg${{ matrix.postgres }}/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false
