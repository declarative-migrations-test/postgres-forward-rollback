name: Canonical quote namespaced readiness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-quote-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    services:
      postgres:
        image: "postgres:${{ matrix.postgres }}"
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out the migration certification harness
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Fetch the exact public Canonical quote API candidate
        shell: bash
        run: >-
          scripts/fetch-exact-public-source.sh
          canonical-cloud/canonical-api-server.rs
          7d22e2671366a2d978b697ea42b27e8e6f72e519
          canonical-api

      - name: Verify immutable source, interface, model, and migration pins
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-repository.py
          test "$(git -C canonical-api rev-parse HEAD)" = \
            "7d22e2671366a2d978b697ea42b27e8e6f72e519"
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          contract = json.loads(Path("canonical-quote-source.json").read_text())
          source = Path("canonical-api")
          assert contract["sourceCommit"] == "7d22e2671366a2d978b697ea42b27e8e6f72e519"
          assert contract["dpmCommit"] == "d05a7880987ddaa271fa88b52c787390ef12b899"
          assert hashlib.sha256(
              (source / contract["schemaPath"]).read_bytes()
          ).hexdigest() == contract["schemaSha256"]

          namespace = json.loads((source / "db/namespace.json").read_text())
          assert namespace["namespaceId"] == "canonical_cloud__quote"
          assert namespace["declarativeMigration"]["revision"] == contract["dpmCommit"]
          assert namespace["readiness"]["endpoint"] == "/readyz"
          assert namespace["readiness"]["runtimeRole"] == "canonical_cloud__quote__api_rw"
          assert namespace["readiness"]["failClosed"] is True

          interfaces = json.loads((source / "interfaces.lock.json").read_text())
          assert interfaces["canonical_lib"]["commit"] == "f0add30d4cc7e6825d24565e1db115751f833966"
          assert interfaces["canonical_interfaces"]["commit"] == "4c6ca63ca24fa214a1cb1a917ac27f1d5265916a"
          fixture = source / interfaces["canonical_interfaces"]["quote_request_fixture"]["path"]
          assert fixture.is_file()
          assert hashlib.sha1((b"blob " + str(fixture.stat().st_size).encode() + b"\0" + fixture.read_bytes())).hexdigest() == \
              interfaces["canonical_interfaces"]["quote_request_fixture"]["git_blob"]

          library = (source / "src/lib.rs").read_text()
          gemini = (source / "src/gemini.rs").read_text()
          env_example = (source / ".env.example").read_text()
          assert 'DEFAULT_GEMINI_MODEL: &str = "gemini-3.6-flash"' in library
          assert 'gemini-3.6-pro' not in library
          assert 'GEMINI_MODEL=gemini-3.6-flash' in env_example
          assert '"thinkingLevel": "high"' in gemini
          assert '"responseFormat"' in gemini
          assert 'analysis_schema()' in gemini
          PY

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache exact Rust builds
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            vendor/declarative-postgres-migrate.rs -> target
            canonical-api -> target
          key: canonical-quote-v1-readiness-pg${{ matrix.postgres }}

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Build pinned dpm
        id: dpm
        shell: bash
        run: |
          set -euo pipefail
          echo "path=$(scripts/build-dpm.sh)" >> "$GITHUB_OUTPUT"

      - name: Format exact Canonical candidate
        run: cargo fmt --manifest-path canonical-api/Cargo.toml --all -- --check

      - name: Test exact Canonical candidate
        run: cargo test --locked --all-targets --manifest-path canonical-api/Cargo.toml

      - name: Lint exact Canonical candidate
        run: cargo clippy --locked --all-targets --manifest-path canonical-api/Cargo.toml -- -D warnings

      - name: Build exact Canonical API binary
        run: cargo build --locked --manifest-path canonical-api/Cargo.toml --bin canonical-api-server

      - name: Apply, exercise quote v1, drift, repair, and certify readiness
        env:
          CANONICAL_API_DIR: ${{ github.workspace }}/canonical-api
          DPM_BIN: ${{ steps.dpm.outputs.path }}
          POSTGRES_ADMIN_URL: postgres://postgres@127.0.0.1:5432/postgres
          POSTGRES_MAJOR: ${{ matrix.postgres }}
        run: bash scripts/test-canonical-quote-readiness.sh

      - name: Upload bounded failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonical-quote-v1-readiness-pg${{ matrix.postgres }}
          path: artifacts/canonical-quote-readiness/pg${{ matrix.postgres }}
          if-no-files-found: warn
          retention-days: 14
