name: PostgreSQL forward and rollback

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out the migration test repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Check out the exact Canonical quote source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: canonical-cloud/canonical-api-server.rs
          ref: 1bbdeec25cac0df54a337d0985381e0575e4b9d5
          path: vendor/canonical-api-server.rs
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: vendor/declarative-postgres-migrate.rs -> target

      - name: Validate repository and Canonical source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-repository.py
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          contract = json.loads(Path('canonical-quote-source.json').read_text())
          source = Path('vendor/canonical-api-server.rs')
          assert contract['sourceCommit'] == '1bbdeec25cac0df54a337d0985381e0575e4b9d5'
          assert hashlib.sha256(
              (source / contract['schemaPath']).read_bytes()
          ).hexdigest() == contract['schemaSha256']
          namespace = json.loads((source / 'db/namespace.json').read_text())
          assert namespace['declarativeMigration']['revision'] == contract['dpmCommit']
          assert namespace['namespaceId'] == 'canonical_cloud__quote'
          assert namespace['readiness']['endpoint'] == '/readyz'
          assert namespace['readiness']['runtimeRole'] == 'canonical_cloud__quote__api_rw'
          assert namespace['readiness']['failClosed'] is True
          assert (source / contract['testScript']).is_file()
          PY

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Build pinned dpm
        id: dpm
        shell: bash
        run: echo "path=$(scripts/build-dpm.sh)" >> "$GITHUB_OUTPUT"

      - name: Run repeated generic PostgreSQL cycles
        env:
          DPM_BIN: ${{ steps.dpm.outputs.path }}
          POSTGRES_ADMIN_URL: postgres://postgres@localhost:5432/postgres
        run: scripts/test-postgres-forward-rollback.sh

      - name: Certify the exact Canonical quote schema independently
        env:
          DPM_BIN: ${{ steps.dpm.outputs.path }}
          POSTGRES_ADMIN_URL: postgres://postgres@localhost:5432/postgres
        working-directory: vendor/canonical-api-server.rs
        run: scripts/test-declarative-postgres.sh

      - name: Upload bounded Canonical failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-quote-postgres-${{ github.run_id }}
          path: vendor/canonical-api-server.rs/artifacts/declarative-postgres
          if-no-files-found: warn
          retention-days: 7
