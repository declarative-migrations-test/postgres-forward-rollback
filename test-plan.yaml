production_org: declarative-migrations
test_org: declarative-migrations-test
repository: postgres-forward-rollback
kind: database
readiness: ready
objectives:
- Verify repeated apply and rollback with schema/data equivalence on PostgreSQL across the supported happy-path states
  and canonical fixtures.
- Verify repeated apply and rollback with schema/data equivalence on PostgreSQL under retries, interruption, concurrency,
  offline operation, or partial failure.
- Verify repeated apply and rollback with schema/data equivalence on PostgreSQL preserves authorization, idempotency,
  integrity, observability, and actionable failure classification.
always_on_checks:
- Validate test-plan and dependency metadata.
- Validate generated fixture and workflow syntax.
- Classify missing upstreams or credentials separately from product regressions.
